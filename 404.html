<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found — Perfectly Planned</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#221B14" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23211E1A'/%3E%3Ctext x='50' y='67' font-family='Georgia,serif' font-size='44' fill='%23CC9A5A' text-anchor='middle' letter-spacing='-3'%3EPP%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
<style>
  .nf{min-height:100svh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:var(--espresso);
    color:var(--paper);padding:120px 28px 80px;position:relative;overflow:hidden}
  .nf__mono{position:absolute;font-family:var(--display);font-size:54vw;
    color:rgba(247,242,233,.04);line-height:.8;pointer-events:none;user-select:none}
  .nf__inner{position:relative;z-index:1;max-width:560px}
  .nf__crest{color:var(--gold-soft);margin-bottom:30px;display:inline-block}
  .nf__code{font-family:var(--sans);font-size:.72rem;letter-spacing:.34em;
    text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .nf__title{font-family:var(--display);font-size:clamp(2.6rem,6vw,4.4rem);
    line-height:1.08;margin:20px 0 8px}
  .nf__title em{font-family:var(--serif);font-style:italic;color:var(--gold-soft)}
  .nf__text{color:rgba(247,242,233,.74);font-size:1.05rem;margin-bottom:36px}
  .nf__actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
</style>
<script>document.documentElement.className = 'js preloaded';</script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<section class="nf">
  <span class="nf__mono" aria-hidden="true">PP</span>
  <div class="nf__inner">
    <span class="nf__crest" aria-hidden="true">
      <svg viewBox="0 0 88 88" width="72" height="72">
        <circle cx="44" cy="44" r="42.5" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="44" cy="44" r="36" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="1.5 3"/>
        <text x="44" y="52" font-family="Forum, serif" font-size="26" fill="currentColor" text-anchor="middle" letter-spacing="1">PP</text>
      </svg>
    </span>
    <p class="nf__code">Error 404</p>
    <h1 class="nf__title">This page <em>wandered off.</em></h1>
    <p class="nf__text">
      The page you're looking for isn't here — but your perfect day still is.
      Let's get you back on the path.
    </p>
    <div class="nf__actions">
      <a class="btn btn--solid btn--lg" href="index.html">Return Home</a>
      <a class="btn btn--line btn--lg" href="contact.html" style="--fg:var(--paper);border-color:rgba(247,242,233,.34)">Begin Your Inquiry</a>
    </div>
  </div>
</section>

<script src="main.js"></script>
</body>
</html>
